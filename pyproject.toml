[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["build"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import 排序)
    "N",      # pep8-naming (命名规范)
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade (语法现代化)
    "C4",     # flake8-comprehensions (推导式优化)
    "SIM",    # flake8-simplify (简化写法)
    "T20",    # flake8-print (禁止残留 print)
    "RUF",    # Ruff 专有规则
]
ignore = ["RUF012", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"CharAgent/**/__init__.py" = ["N999"]
"CharAgent/**/__main__.py" = ["N999"]
# 假商城的 HTTP 处理器: `do_GET` 这个名字是 `BaseHTTPRequestHandler` 的**分派约定**,
# 改不得. 这里按文件豁免而不是就地 `# noqa` —— pre-commit 钉的 ruff (0.12) 要那道
# noqa, 而 venv 里的新版 (0.15) 反过来判它「多余」(RUF100), 两边打架; 写进配置两边
# 都干净.
"CharApp/tests/test_mcp_two_sides.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
