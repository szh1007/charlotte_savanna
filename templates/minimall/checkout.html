{% extends "minimall/base.html" %}
{% block title %}确认订单 - 淘宝{% endblock %}
{% block container_class %}container wide{% endblock %}
{% block content %}
<div style="background:#fff;border-radius:14px;padding:24px 32px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
<h2 class="page-title" style="margin-bottom:20px">确认订单</h2>
<div x-data="checkoutPage()" x-init="init()">
  <template x-if="loading">
    <p style="text-align:center;padding:60px;color:#aaa;">加载中...</p>
  </template>
  <template x-if="!loading && cartItems.length === 0">
    <p style="text-align:center;padding:60px;color:#aaa;">没有待结算商品. <a href="/shop/">去逛逛</a></p>
  </template>
  <template x-if="!loading && cartItems.length > 0">
    <div style="display:grid;grid-template-columns:1fr 400px;gap:24px;">
      <!-- 商品明细 -->
      <div>
        <h3 style="margin-bottom:16px;">商品明细</h3>
        <table style="width:100%;">
          <thead>
            <tr style="text-align:left;">
              <th style="padding:14px 16px;width:40%;">商品</th>
              <th style="padding:14px 16px;width:20%;">单价</th>
              <th style="padding:14px 16px;width:15%;">数量</th>
              <th style="padding:14px 16px;width:25%;">小计</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in cartItems" :key="item.id">
              <tr style="border-bottom:1px solid #eee;">
                <td style="padding:14px 16px;font-weight:500;" x-text="item.product_name"></td>
                <td style="padding:14px 16px;">¥<span x-text="item.product_price"></span></td>
                <td style="padding:14px 16px;" x-text="item.quantity"></td>
                <td style="padding:14px 16px;font-weight:600;">¥<span x-text="Number(item.subtotal).toFixed(2)"></span></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- 右侧 -->
      <div>
        <div style="background:#fafbfc;border-radius:12px;padding:24px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <h3 style="margin:0;font-size:15px;font-weight:600;">收货地址</h3>
            <a href="/shop/addresses/" style="font-size:13px;color:#ff6b6b;font-weight:500;">管理</a>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
            <template x-for="addr in addresses" :key="addr.id">
              <div @click="selectAddr(addr, $el)"
                   :style="{padding:'16px 14px',borderRadius:'10px',cursor:'pointer',transition:'all .15s',border:'1.5px solid '+(addressId===addr.id?'#ff6b6b':'#e9ecef'),background:addressId===addr.id?'#fff5f5':'#fff'}"
                   @mouseenter="if(addressId!==addr.id) $el.style.borderColor='#ddd'"
                   @mouseleave="if(addressId!==addr.id) $el.style.borderColor='#e9ecef'">
                <div style="font-weight:600;font-size:14px;margin-bottom:2px;">
                  <span x-text="addr.receiver_name"></span>
                  <span style="margin-left:10px;color:#999;font-weight:400;font-size:13px;" x-text="addr.phone"></span>
                  <span x-show="addr.is_default" style="margin-left:8px;background:#ff6b6b;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;vertical-align:middle;">默认</span>
                </div>
                <div class="addr-text" style="color:#999;font-size:13px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;"
                     :style="{whiteSpace: (addressId===addr.id && addrExpanded) ? 'normal' : 'nowrap'}"
                     x-text="addr.province + addr.city + addr.district + ' ' + addr.detail"></div>
                <div x-show="addressId===addr.id && !addrExpanded && addrTruncated"
                     style="color:#ff6b6b;font-size:12px;margin-top:2px;">点击查看详情</div>
              </div>
            </template>
            <div x-show="addresses.length === 0" style="text-align:center;padding:16px;color:#adb5bd;font-size:14px;">
              暂无地址，请<a href="/shop/addresses/" style="color:#ff6b6b;">新增</a>
            </div>
          </div>
          <div style="font-size:20px;margin-bottom:20px;padding-top:16px;border-top:1px solid #eee;">
            <span style="color:#666;">合计: </span>
            <strong style="color:#ff6b6b;font-size:24px;">¥<span x-text="totalAmount.toFixed(2)"></span></strong>
          </div>
          <button class="btn btn-primary" @click="placeOrder" :disabled="!addressId || cartItems.length === 0"
                  style="width:100%;">
            提交订单
          </button>
        </div>
      </div>
    </div>
  </template>
</div>
</div>
<script>
function checkoutPage() {
  return {
    cartItems: [], addresses: [], addressId: '', addrExpanded: false, addrTruncated: false, loading: true,
    selectAddr: function(addr, el) {
      if (this.addressId === addr.id) {
        if (this.addrTruncated) {
          this.addrExpanded = !this.addrExpanded;
        }
      } else {
        this.addressId = addr.id;
        this.addrExpanded = false;
        // 检测地址文字是否溢出
        var self = this;
        requestAnimationFrame(function() {
          var textEl = el.querySelector('.addr-text');
          if (textEl) self.addrTruncated = textEl.scrollWidth > textEl.clientWidth;
        });
      }
    },
    get totalAmount() { return this.cartItems.reduce((s,i) => s + i.subtotal, 0); },
    getSelectedIds() {
      var p = new URLSearchParams(window.location.search);
      var ids = p.get('ids');
      return ids ? ids.split(',').map(Number) : [];
    },
    async init() {
      this.loading = true;
      try {
        var selectedIds = this.getSelectedIds();
        const [cartR, addrR] = await Promise.all([fetch('/api/cart/'), fetch('/api/addresses/')]);
        const cartData = await cartR.json();
        var allItems = cartData.items || [];
        if (selectedIds.length > 0) {
          this.cartItems = allItems.filter(function(i) { return selectedIds.indexOf(i.id) !== -1; });
        } else {
          this.cartItems = allItems;
        }
        this.addresses = await addrR.json();
        if (this.addresses.length > 0) {
          const def = this.addresses.find(function(a) { return a.is_default; });
          this.addressId = def ? def.id : this.addresses[0].id;
        }
      } finally { this.loading = false; }
      // 初始检测默认地址是否溢出
      this.$nextTick(() => { this.checkTruncated(); });
    },
    checkTruncated: function() {
      var self = this;
      requestAnimationFrame(function() {
        var textEl = document.querySelector('.addr-text');
        if (textEl) self.addrTruncated = textEl.scrollWidth > textEl.clientWidth;
      });
    },
    async placeOrder() {
      const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
      const r = await fetch('/api/orders/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
        body: JSON.stringify({
          cart_item_ids: this.cartItems.map(i => i.id),
          address_id: this.addressId,
        })
      });
      if (r.ok) {
        const data = await r.json();
        notifyCartUpdated();
        window.location.href = '/shop/orders/' + data.order_no + '/';
      } else {
        const err = await r.json();
        alert(err.detail || '提交订单失败');
      }
    }
  };
}
</script>
{% endblock %}
