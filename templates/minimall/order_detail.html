{% extends "minimall/base.html" %}
{% block title %}订单详情 - 淘宝{% endblock %}
{% block container_class %}container wide{% endblock %}
{% block content %}
<div x-data="orderDetail" x-init="init()" style="background:#fff;border-radius:14px;padding:24px 32px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
  <template x-if="loading">
    <div style="text-align:center;padding:60px;color:#adb5bd;">加载中...</div>
  </template>
  <template x-if="!loading && order">
    <div>
      <!-- Status header -->
      <div style="background:#fff;border-radius:12px;padding:28px 32px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <span style="color:#999;font-size:14px;">订单号：</span>
            <span style="font-family:inherit;letter-spacing:0.3px;font-weight:600;" x-text="order.order_no"></span>
          </div>
          <div style="font-size:18px;font-weight:700;" :style="{color: statusColor(order.status)}" x-text="statusLabel(order.status)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:24px;position:relative;">
          <!-- 底色灰线 -->
          <div style="position:absolute;top:14px;left:0;right:0;height:4px;background:#e9ecef;border-radius:2px;"></div>
          <!-- 一整条连续红线，从最左边到当前状态圆心 -->
          <div :style="{position:'absolute',top:'14px',height:'4px',background:'#ff6b6b',borderRadius:'2px',
                        left:'0',width:redLineWidth()+'%'}">
          </div>
          <template x-for="(s, idx) in steps" :key="s.key">
            <div style="position:relative;text-align:center;z-index:1;flex:1;">
              <!-- 当前进行中步骤：脉冲动画 -->
              <div x-show="isActive(s.key)" style="width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #ff6b6b;animation:pulse 1.5s ease-in-out infinite;">
                <span style="color:#ff6b6b;font-size:14px;font-weight:700;">&#9679;</span>
              </div>
              <!-- 已完成 -->
              <div x-show="stepDone(s.key) && !isActive(s.key)" style="width:28px;height:28px;border-radius:50%;background:#ff6b6b;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;">
                <span style="color:#fff;font-size:14px;">&#10003;</span>
              </div>
              <!-- 未完成且非进行中 -->
              <div x-show="!stepDone(s.key) && !isActive(s.key)" style="width:28px;height:28px;border-radius:50%;background:#e9ecef;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;">
                <span style="color:#adb5bd;font-size:14px;">&#9679;</span>
              </div>
              <div style="font-size:12px;" :style="{color: stepDone(s.key)?'#ff6b6b':'#adb5bd',fontWeight: isActive(s.key)?'600':'400'}" x-text="s.label"></div>
              <div style="font-size:11px;color:#ccc;" x-text="s.time ? new Date(s.time).toLocaleString() : ''"></div>
            </div>
          </template>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 400px;gap:20px;">
        <!-- Left: items -->
        <div style="background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
          <h3>商品明细</h3>
          <template x-for="item in order.items" :key="item.id">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f3f5;">
              <div style="flex:1;">
                <div style="font-weight:500;" x-text="item.product_name"></div>
                <div style="font-size:13px;color:#adb5bd;">&yen;<span x-text="item.product_price"></span> x <span x-text="item.quantity"></span></div>
              </div>
              <div style="font-weight:600;">&yen;<span x-text="Number(item.subtotal).toFixed(2)"></span></div>
            </div>
          </template>
          <div style="text-align:right;margin-top:16px;font-size:20px;font-weight:800;">
            合计: &yen;<span x-text="Number(order.total_amount).toFixed(2)"></span>
          </div>
        </div>

        <!-- Right -->
        <div>
          <div style="background:#fafbfc;border-radius:12px;padding:20px 24px;border:1px solid #e9ecef;margin-bottom:16px;">
            <h3 style="font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              收货信息
            </h3>
            <div style="font-size:14px;line-height:1.8;">
              <div style="font-weight:600;font-size:15px;margin-bottom:4px;">
                <span x-text="(order.shipping_address_snapshot||{}).receiver_name"></span>
                <span style="margin-left:12px;color:#999;font-weight:400;font-size:14px;" x-text="(order.shipping_address_snapshot||{}).phone"></span>
              </div>
              <div style="color:#999;font-size:13px;" x-text="((order.shipping_address_snapshot||{}).province||'')+((order.shipping_address_snapshot||{}).city||'')+((order.shipping_address_snapshot||{}).district||'') + ' ' + ((order.shipping_address_snapshot||{}).detail||'')"></div>
            </div>
          </div>

          <div x-show="['pending','paid','shipped','received'].includes(order.status)" style="background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);">
            <template x-if="order.status === 'pending'">
              <div>
                <button @click="openPayModal" style="width:100%;padding:12px;background:#ff6b6b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;">确认支付</button>
                <button @click="doCancel" style="width:100%;margin-top:8px;padding:12px;background:#f1f3f5;color:#666;border:none;border-radius:8px;cursor:pointer;font-size:15px;">取消订单</button>
              </div>
            </template>
            <template x-if="order.status === 'paid'">
              <button @click="doCancel" style="width:100%;padding:12px;background:#f1f3f5;color:#666;border:none;border-radius:8px;cursor:pointer;font-size:15px;">取消订单</button>
            </template>
            <template x-if="order.status === 'shipped'">
              <button @click="doReceive" style="width:100%;padding:12px;background:#ff6b6b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;">确认收货</button>
            </template>
            <template x-if="order.status === 'received'">
              <button @click="doComplete" style="width:100%;padding:12px;background:#ff6b6b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;">确认完成</button>
            </template>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- 支付密码弹窗 -->
<div x-show="payModal.show" style="position:fixed;inset:0;z-index:2001;">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;" @click.self="closePayModal()">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);"></div>
    <div style="position:relative;background:#fff;border-radius:16px;padding:36px 32px;max-width:400px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center;z-index:1;" @click.stop="">
      <button @click="closePayModal" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;color:#adb5bd;cursor:pointer;line-height:1;">&times;</button>
      <div style="font-size:16px;font-weight:600;color:#333;margin-bottom:20px;">请输入支付密码</div>
      <input id="pay-hidden" type="password" inputmode="numeric" maxlength="6" autocomplete="off"
             x-model="payPwd" @keydown.enter="confirmPay"
             placeholder=""
             style="width:100%;padding:14px 16px;border:1.5px solid #e0e0e0;border-radius:12px;text-align:center;font-size:20px;letter-spacing:6px;outline:none;transition:all .2s;background:#fafbfc;box-sizing:border-box;"
             @focus="$el.style.borderColor='#ff6b6b';$el.style.boxShadow='0 0 0 3px rgba(255,107,107,.12)';$el.style.background='#fff';"
             @blur="$el.style.borderColor='#e0e0e0';$el.style.boxShadow='none';$el.style.background='#fafbfc';">
      <div x-show="payModal.error" style="color:#e63946;font-size:13px;margin-top:16px;margin-bottom:4px;padding:8px 16px;background:#fff5f5;border-radius:8px;" x-text="payModal.error"></div>
      <button @click="confirmPay"
              :disabled="payPwd.length !== 6"
              style="margin-top:20px;width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;"
              :class="payPwd.length === 6 ? 'pay-btn-active' : 'pay-btn-disabled'">
        确认支付
      </button>
    </div>
  </div>
</div>

<!-- 余额不足弹窗 -->
<div x-show="modal.show" style="position:fixed;inset:0;z-index:2000;">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;" @click.self="closeModal()">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);"></div>
    <div style="position:relative;background:#fff;border-radius:16px;padding:36px 32px;max-width:400px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center;z-index:1;">
      <button @click="closeModal" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;color:#adb5bd;cursor:pointer;line-height:1;">&times;</button>
      <div style="font-size:48px;margin-bottom:12px;">💸</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:8px;color:#333;" x-text="modal.title"></div>
      <div style="color:#666;font-size:14px;line-height:1.6;margin-bottom:24px;" x-text="modal.message"></div>
      <div style="display:flex;gap:12px;">
        <button @click="closeModal()" style="flex:1;padding:13px;border:1.5px solid #e9ecef;border-radius:12px;background:#fff;color:#666;font-size:14px;cursor:pointer;font-weight:500;transition:all .15s;">取消</button>
        <a :href="modal.actionUrl" style="flex:1;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff6b6b,#ee5a5a);color:#fff;font-size:14px;font-weight:600;text-decoration:none;display:inline-block;box-shadow:0 4px 14px rgba(255,107,107,.3);" x-text="modal.actionLabel"></a>
      </div>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div x-show="confirmModal.show" style="position:fixed;inset:0;z-index:2002;">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
    <div @mousedown="closeConfirmModal()" style="position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);"></div>
    <div style="position:relative;background:#fff;border-radius:16px;padding:36px 32px;max-width:380px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center;z-index:1;" @mousedown.stop="">
      <button @click="closeConfirmModal()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;color:#adb5bd;cursor:pointer;line-height:1;">&times;</button>
      <div style="font-size:40px;margin-bottom:12px;">⚠</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:8px;color:#333;" x-text="confirmModal.title"></div>
      <div style="color:#666;font-size:14px;line-height:1.6;margin-bottom:24px;" x-text="confirmModal.message"></div>
      <div style="display:flex;gap:12px;">
        <button @click="closeConfirmModal()" style="flex:1;padding:12px;border:1.5px solid #e9ecef;border-radius:12px;background:#fff;color:#666;font-size:14px;cursor:pointer;font-weight:500;">取消</button>
        <button @click="confirmModal.onConfirm(); closeConfirmModal();" style="flex:1;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff6b6b,#ee5a5a);color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(255,107,107,.3);">确定</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('orderDetail', () => ({
    order: null, loading: true,
    modal: {show: false, title: '', message: '', actionLabel: '', actionUrl: ''},
    payModal: {show: false, error: ''}, payPwd: '',
    confirmModal: {show: false, title: '', message: '', onConfirm: null},
    get orderNo() { var p = window.location.pathname.split('/').filter(function(s){return s;}); return p[p.length-1] || ''; },
    async init() {
      try {
        var r = await fetch('/api/minimall/orders/' + this.orderNo + '/');
        this.order = await r.json();
      } catch(e) { console.error(e); }
      finally { this.loading = false; }
    },
    get steps() {
      if (!this.order) return [];
      var st = this.order.status_timeline || [];
      return ['pending','paid','shipped','received','completed'].map(function(k){
        var labels = {pending:'已下单',paid:'已付款',shipped:'已发货',received:'已收货',completed:'已完成'};
        var found = st.find(function(x){return x.status === k;});
        return {key: k, label: labels[k], time: found ? found.time : ''};
      });
    },
    redLineWidth: function() {
      if (!this.order) return 0;
      var order2 = ['pending','paid','shipped','received','completed'];
      // 找到第一个未完成步骤（下一个状态），红线连到该步骤圆心
      for (var i = 0; i < order2.length; i++) {
        if (!this.stepDone(order2[i])) {
          return (100 / 5 * (i + 0.5));
        }
      }
      // 全部完成，红线铺满整条
      return 100;
    },
    isActive: function(key) {
      if (this.order.status === 'cancelled' || this.order.status === 'refunded') return false;
      if (this.order.status === 'completed') return false;
      var order2 = ['pending','paid','shipped','received','completed'];
      // 找到第一个未完成的步骤，即为"下一个状态"
      for (var i = 0; i < order2.length; i++) {
        if (!this.stepDone(order2[i])) {
          return order2.indexOf(key) === i;
        }
      }
      return false;
    },
    stepDone: function(key) {
      var s = this.order.status;
      var order2 = ['pending','paid','shipped','received','completed'];
      if (s === 'cancelled' || s === 'refunded') {
        // 根据时间线判断哪些步骤已完成
        var tl = this.order.status_timeline || [];
        var doneKeys = tl.map(function(x) { return x.status; });
        return doneKeys.indexOf(key) !== -1;
      }
      return order2.indexOf(key) <= order2.indexOf(s);
    },
    doCancel: function() {
      var self = this;
      this.confirmModal = {show: true, title: '取消订单', message: '确定要取消该订单吗？', onConfirm: function() { self.doAction('/api/minimall/orders/'+self.orderNo+'/cancel/'); }};
    },
    doReceive: function() {
      var self = this;
      this.confirmModal = {show: true, title: '确认收货', message: '确定已收到商品？', onConfirm: function() { self.doAction('/api/minimall/orders/'+self.orderNo+'/receive/'); }};
    },
    doComplete: function() {
      var self = this;
      this.confirmModal = {show: true, title: '确认完成', message: '确定该订单已完成？', onConfirm: function() { self.doAction('/api/minimall/orders/'+self.orderNo+'/complete/'); }};
    },
    closeConfirmModal: function() { this.confirmModal.show = false; },
    async doAction(url) {
      var csrf = document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : '';
      var r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf}});
      if (r.ok) { await r.json(); location.reload(); }
      else { var e = await r.json(); alert(e.detail||'操作失败'); }
    },

    // ---- pay modal ----
    openPayModal: function() {
      this.payModal = {show: true, error: ''};
      this.payPwd = '';
      var self = this;
      this.$nextTick(function() {
        var el = document.getElementById('pay-hidden');
        if (el) el.focus();
      });
    },
    closePayModal: function() { this.payModal.show = false; },
    async confirmPay() {
      if (!this.payPwd || this.payPwd.length !== 6) return;
      this.payModal.error = '';
      var url = '/api/minimall/orders/' + this.orderNo + '/pay/';
      var csrf = document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : '';
      var r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify({payment_password: this.payPwd})});
      if (r.ok) { await r.json(); location.reload(); }
      else {
        var e = await r.json();
        var msg = e.detail || '操作失败';
        if (msg.indexOf('余额不足') !== -1) {
          this.closePayModal();
          this.modal = {show: true, title: '余额不足', message: '当前账户余额不足以支付该订单，是否前往充值?', actionLabel: '去充值', actionUrl: '/minimall/profile/'};
        } else {
          this.payModal.error = msg;
          this.payPwd = '';
          var self = this;
          this.$nextTick(function() {
            var el = document.getElementById('pay-hidden');
            if (el) el.focus();
          });
        }
      }
    },
    closeModal: function() { this.modal.show = false; },
    statusColor: function(s) { var m={pending:'#f4a261',paid:'#ff6b6b',shipped:'#339af0',received:'#20c997',completed:'#20c997',cancelled:'#adb5bd',refunded:'#adb5bd'}; return m[s]||'#333'; },
    statusLabel: function(s) { var m={pending:'待付款',paid:'已付款',shipped:'已发货',received:'已收货',completed:'已完成',cancelled:'已取消',refunded:'已退款'}; return m[s]||s; }
  }));
});
</script>

<style>
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,107,107,.4); }
    50% { transform: scale(1.08); box-shadow: 0 0 0 6px rgba(255,107,107,0); }
  }
  .pay-btn-active { background: linear-gradient(135deg,#ff6b6b,#ee5a5a); color: #fff; box-shadow: 0 4px 14px rgba(255,107,107,.3); }
  .pay-btn-active:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,107,107,.4); }
  .pay-btn-disabled { background: #e9ecef; color: #adb5bd; cursor: not-allowed; }
</style>
{% endblock %}
