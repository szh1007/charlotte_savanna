<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}minimall{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%23ff6b6b'/><text x='32' y='46' font-size='44' font-weight='bold' text-anchor='middle' fill='%23fff'>M</text></svg>">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.9" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'HarmonyOS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #333; background: #f0f2f5; -webkit-font-smoothing: antialiased; }
    nav { display: flex; align-items: center; padding: 0 40px; height: 64px; background: linear-gradient(135deg, #f5a623 0%, #f7b733 40%, #f0a010 100%); color: #fff; gap: 24px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(245,166,35,.3); }
    nav a { color: #fff; text-decoration: none; transition: opacity .2s; }
    nav a:hover { opacity: .85; }
    nav .logo { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.15); }
    nav .logo:hover { color: #fff3cd; opacity: 1; }
    nav .search-box { flex: 1; max-width: 480px; position: relative; }
    nav .search-box::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .6; pointer-events: none; z-index: 1; }
    nav .search-box input { width: 100%; padding: 10px 16px 10px 38px; border: none; border-radius: 22px; background: rgba(255,255,255,.18); backdrop-filter: blur(8px); color: #fff; font-size: 14px; outline: none; transition: all .25s; }
    nav .search-box input::placeholder { color: rgba(255,255,255,.6); }
    nav .search-box input:focus { background: rgba(255,255,255,.28); box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
    nav .nav-links { display: flex; gap: 24px; align-items: center; margin-left: auto; }
    .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }
    .container.wide { padding: 0 40px; max-width: 100%; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .product-card { background: #fff; border-radius: 12px; overflow: hidden; transition: transform .2s, box-shadow .2s; cursor: pointer; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,.12); }
    .product-card .img-wrap { width: 100%; height: 220px; background: #f8f9fa; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .product-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
    .product-card:hover .img-wrap img { transform: scale(1.05); }
    .product-card .img-wrap .no-img { font-size: 56px; color: #dee2e6; }
    .product-card .info { padding: 14px 16px; }
    .product-card .name { font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #333; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-card .price { font-size: 20px; font-weight: 800; color: #ff6b6b; }
    .product-card .info .cat { font-size: 12px; color: #adb5bd; margin-top: 4px; }
    footer { text-align: center; padding: 32px; color: #adb5bd; font-size: 13px; background: #fff; border-top: 1px solid #eee; margin-top: 40px; }
    .two-col { display: flex; gap: 24px; }
    .sidebar { width: 200px; flex-shrink: 0; background: #fff; border-radius: 12px; padding: 20px; }
    .sidebar h3 { font-size: 16px; margin-bottom: 12px; color: #333; }
    .sidebar ul { list-style: none; }
    .sidebar li { padding: 6px 0; }
    .sidebar-link { color: #555; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; transition: all .15s; }
    .sidebar-link:hover { background: #fdf2f2; color: #ff6b6b; }
    .sidebar-featured { display: flex; align-items: center; gap: 10px; padding: 16px; text-decoration: none; color: #fff; font-size: 15px; font-weight: 700; transition: all .25s; }
    .sidebar-featured:hover { filter: brightness(1.1); }
    .main { flex: 1; }
    .filters-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; background: #fff; padding: 14px 18px; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .filters-bar input, .filters-bar select { padding: 9px 14px; border: 1.5px solid #d0d5dd; border-radius: 10px; font-size: 13px; outline: none; transition: all .2s; background: #fff; }
    .filters-bar input:hover, .filters-bar select:hover { border-color: #b0b5bd; }
    .filters-bar input:focus, .filters-bar select:focus { border-color: #ff6b6b; background: #fff; box-shadow: 0 0 0 3px rgba(255,107,107,.1); }
    .filters-bar button { padding: 9px 22px; background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 600; transition: all .2s; box-shadow: 0 2px 8px rgba(255,107,107,.25); }
    .filters-bar button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(255,107,107,.35); }
    .filters-bar .count-badge { background: linear-gradient(135deg,#0ea5a0,#22d3d8); color: #fff; padding: 10px 22px; border-radius: 24px; font-size: 14px; font-weight: 700; margin-left: auto; box-shadow: 0 3px 12px rgba(14,165,160,.35); letter-spacing: 1px; }
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .section-title .count { font-size: 14px; font-weight: 400; color: #adb5bd; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; background: #fff; border-radius: 12px; padding: 32px; }
    .detail-image-wrap { width: 100%; border-radius: 12px; overflow: hidden; background: #f8f9fa; display: flex; align-items: center; justify-content: center; }
    .detail-image-wrap img { width: 100%; object-fit: contain; }
    .detail-info h1 { font-size: 26px; margin-bottom: 16px; }
    .detail-info .price-detail { font-size: 32px; color: #ff6b6b; font-weight: 800; margin-bottom: 16px; }
    .detail-info .stock-detail { color: #868e96; margin-bottom: 24px; font-size: 15px; }
    .detail-info .desc { color: #666; line-height: 1.7; margin-bottom: 24px; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all .2s; }
    .btn-primary { background: #ff6b6b; color: #fff; }
    .btn-primary:hover { background: #ee5a5a; transform: translateY(-1px); }
    .btn:disabled { background: #dee2e6; cursor: not-allowed; transform: none; }
    .quantity-input { width: 64px; padding: 10px; text-align: center; border: 1px solid #e9ecef; border-radius: 8px; font-size: 15px; }
    .card-cart-btn {
      position: absolute; bottom: 12px; right: 12px;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,107,107,.9); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .2s; opacity: 0; transform: translateY(4px);
      box-shadow: 0 2px 8px rgba(255,107,107,.3);
    }
    .product-card:hover .card-cart-btn { opacity: 1; transform: translateY(0); }
    .card-cart-btn:hover { background: #ff6b6b; transform: translateY(0) scale(1.1) !important; }
    .cart-badge {
      position: absolute; top: -8px; right: -12px;
      background: #ff6b6b; color: #fff;
      border-radius: 10px; min-width: 20px; height: 20px; padding: 0 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; line-height: 1;
    }
    #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 20px 36px; border-radius: 14px; color: #fff; z-index: 3000; font-size: 18px; font-weight: 600; box-shadow: 0 12px 40px rgba(0,0,0,.25); letter-spacing: 0.5px; }
    #toast.success { background: #20c997; }
    #toast.error { background: #ff6b6b; }
    .dropdown-menu a:hover { background: #f8f9fa; }
    table { background: #fff; border-radius: 12px; overflow: hidden; }
    table th { background: #f8f9fa; font-weight: 600; font-size: 14px; color: #666; }
    .page-title { font-size: 22px; font-weight: 700; padding-left: 16px; border-left: 4px solid #ff6b6b; color: #333; letter-spacing: 0.5px; }
  </style>
</head>
<body x-data="app()" @toast.window="toast = $event.detail; setTimeout(() => toast = null, 2000)">
  <nav>
    <a href="/shop/" class="logo">淘宝</a>
    <div class="search-box">
      <form method="get" action="/shop/">
        <input type="text" placeholder="搜索商品名称" name="search" value="{{ search|default:'' }}">
      </form>
    </div>
    <div class="nav-links">
      <a href="/shop/cart/" title="购物车" style="position:relative;display:inline-flex;align-items:center;"
         @cart-updated.window="refreshCartCount()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span x-show="cartCount > 0" class="cart-badge" x-text="cartCount"></span>
      </a>
      <a href="/shop/orders/" title="我的订单" style="position:relative;display:inline-flex;align-items:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span x-show="orderCount > 0" class="cart-badge" x-text="orderCount"></span>
      </a>
      {% if user.is_authenticated %}
        <span style="color:#fff;font-weight:700;font-size:14px;">&yen;{{ user.minimall_profile.balance|floatformat:2 }}</span>
        <!-- Avatar dropdown -->
        <div style="position:relative;display:inline-flex;align-items:center;">
          <div @click="dropdownOpen = !dropdownOpen" style="cursor:pointer;">
            {% if user.minimall_profile.avatar %}
              <img src="{{ user.minimall_profile.avatar.url }}?v={{ user.minimall_profile.avatar_version }}{% if user.minimall_profile.avatar_updated_at %}&t={{ user.minimall_profile.avatar_updated_at.timestamp }}{% endif %}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
            {% else %}
              <div style="width:32px;height:32px;border-radius:50%;background:#e63946;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;">{{ user.username|first|upper }}</div>
            {% endif %}
          </div>
          <div x-show="dropdownOpen" x-transition
               style="position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);min-width:160px;z-index:1000;overflow:hidden;">
            <a href="/shop/profile/" style="display:flex;align-items:center;gap:8px;padding:12px 16px;color:#333;text-decoration:none;" @click="dropdownOpen=false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              个人中心
            </a>
            <a href="/shop/addresses/" style="display:flex;align-items:center;gap:8px;padding:12px 16px;color:#333;text-decoration:none;" @click="dropdownOpen=false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              收货地址
            </a>
            <div style="border-top:1px solid #eee;"></div>
            <a href="#" @click="fetch('/api/auth/logout/',{method:'POST',headers:{'X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value}}).then(()=>location.href='/shop/');return false;"
               style="display:flex;align-items:center;gap:8px;padding:12px 16px;color:#e63946;text-decoration:none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              退出
            </a>
          </div>
          <div x-show="dropdownOpen" @click="dropdownOpen = false" style="position:fixed;inset:0;z-index:999;"></div>
        </div>
      {% else %}
        <a href="/shop/login/">登录</a>
        <a href="/shop/register/">注册</a>
      {% endif %}
    </div>
  </nav>

  <div x-show="toast" :class="toast?.type" id="toast" x-text="toast?.message" style="display:block;"></div>

  <div class="{% block container_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </div>

  <script>
    function app() {
      return {
        toast: null,
        dropdownOpen: false,
        cartCount: 0,
        orderCount: 0,
        init() { this.refreshCartCount(); this.refreshOrderCount(); },
        async refreshCartCount() {
          try { const r = await fetch('/api/cart/'); const d = await r.json(); this.cartCount = d.total_count || 0; } catch(e) {}
        },
        async refreshOrderCount() {
          try { const r = await fetch('/api/orders/active-count/'); const d = await r.json(); this.orderCount = d.count || 0; } catch(e) {}
        },
        async addToCart(productId, event) {
          const btn = event.currentTarget;
          btn.style.pointerEvents = 'none';
          try {
            const r = await fetch('/api/cart/items/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || '',
              },
              body: JSON.stringify({product_id: productId, quantity: 1}),
            });
            if (r.ok) {
              this.toast = {type: 'success', message: '已加入购物车'};
              setTimeout(() => this.toast = null, 2000);
              notifyCartUpdated();
            } else {
              this.toast = {type: 'error', message: '添加失败'};
              setTimeout(() => this.toast = null, 2000);
            }
          } catch(e) {
            this.toast = {type: 'error', message: '网络错误'};
            setTimeout(() => this.toast = null, 2000);
          }
          btn.style.pointerEvents = '';
        },
      };
    }
    function notifyCartUpdated() { window.dispatchEvent(new CustomEvent('cart-updated')); }
  </script>
  {% csrf_token %}
</body>
</html>
