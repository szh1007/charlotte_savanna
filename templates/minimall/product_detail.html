{% extends "minimall/base.html" %}
{% block title %}{{ product.name }} - 淘宝{% endblock %}
{% block content %}
<div class="detail-grid">
  <div x-data="imageGallery()" class="detail-gallery">
    <div class="gallery-main">
      <button class="gallery-arrow gallery-prev" @click="prev" x-show="images.length > 1">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img :src="current().url" :alt="current().alt" class="gallery-main-img">
      <button class="gallery-arrow gallery-next" @click="next" x-show="images.length > 1">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="gallery-thumbs" x-show="images.length > 1">
      <template x-for="(img, idx) in images" :key="idx">
        <div class="gallery-thumb" :class="{active: idx === activeIndex}" @click="activeIndex = idx">
          <img :src="img.url" :alt="img.alt">
        </div>
      </template>
    </div>
  </div>
  <div class="detail-info">
    <h1>{{ product.name }}</h1>
    <p class="price-detail">&yen;{{ product.price }}</p>
    <p class="stock-detail">库存: {% if product.stock > 0 %}{{ product.stock }} 件{% else %}暂时缺货{% endif %}</p>
    <p class="desc">{{ product.description }}</p>
    <div style="display:flex;gap:12px;align-items:center;">
      <input type="number" class="quantity-input" value="1" min="1" max="{{ product.stock }}" id="qty" {% if product.stock == 0 %}disabled{% endif %}>
      <button class="btn btn-primary" id="add-to-cart-btn"
              {% if product.stock == 0 %}disabled{% endif %}
              @click="fetch('/api/cart/items/', {method:'POST',
                headers:{'Content-Type':'application/json','X-CSRFToken':$el.dataset.csrf},
                body:JSON.stringify({product_id:{{ product.id }},quantity:document.getElementById('qty').value})})
              .then(r => r.ok ? ($dispatch('toast',{type:'success',message:'已加入购物车'}),notifyCartUpdated()) : $dispatch('toast',{type:'error',message:'添加失败'}))"
              data-csrf="{{ csrf_token }}">
        {% if product.stock > 0 %}加入购物车{% else %}暂时缺货{% endif %}
      </button>
    </div>
  </div>
</div>

<script>
  function imageGallery() {
    return {
      images: [
        {% for img in product.images.all %}
          {url: "{{ img.image.url }}?v={{ img.image_version }}{% if img.image_updated_at %}&t={{ img.image_updated_at.timestamp }}{% endif %}", alt: "{{ product.name }}"}{% if not forloop.last %},{% endif %}
        {% endfor %}
      ],
      activeIndex: 0,
      current() { return this.images[this.activeIndex] || {url: "", alt: ""}; },
      next() { this.activeIndex = (this.activeIndex + 1) % this.images.length; },
      prev() { this.activeIndex = (this.activeIndex - 1 + this.images.length) % this.images.length; },
    };
  }
</script>

<style>
  .detail-gallery { display: flex; flex-direction: column; gap: 12px; }
  .gallery-main { position: relative; background: #f8f9fa; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 400px; }
  .gallery-main-img { width: 100%; height: 100%; max-height: 500px; object-fit: contain; }
  .gallery-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.3); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: background .2s; }
  .gallery-arrow:hover { background: rgba(0,0,0,.55); }
  .gallery-prev { left: 12px; }
  .gallery-next { right: 12px; }
  .gallery-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .gallery-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border .2s; opacity: .6; }
  .gallery-thumb.active { border-color: #ff6b6b; opacity: 1; }
  .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .gallery-thumb:hover { opacity: 1; }
</style>
{% endblock %}
