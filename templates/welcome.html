{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>charlotte_savanna</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex; align-items: center; justify-content: center;
    }
    .welcome { text-align: center; padding: 40px; }
    .welcome h1 { color: #fff; font-size: 42px; font-weight: 800; margin-bottom: 12px; letter-spacing: 2px; }
    .welcome p { color: rgba(255,255,255,.6); font-size: 18px; margin-bottom: 48px; }
    .apps { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
    .app-card {
      display: block;
      width: 240px; padding: 32px 24px;
      background: rgba(255,255,255,.08); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
      text-decoration: none; color: #fff;
      transition: transform .3s, background .3s;
    }
    .app-card:hover { transform: translateY(-6px); background: rgba(255,255,255,.14); }
    .app-card .icon { font-size: 48px; margin-bottom: 16px; }
    .app-card h2 { font-size: 22px; margin-bottom: 8px; }
    .app-card p { color: rgba(255,255,255,.5); font-size: 14px; }
  </style>
</head>
<body>
  <div class="welcome">
    <h1>charlotte</h1>
    <p>为了更美好的未来</p>
    <div class="apps">
      <a href="/shop/" class="app-card">
        <div class="icon">🛒</div>
        <h2>Minimall</h2>
      </a>
      <a href="/admin/" class="app-card">
        <div class="icon">⚙</div>
        <h2>Admin</h2>
      </a>
    </div>
  </div>
</body>
</html>
