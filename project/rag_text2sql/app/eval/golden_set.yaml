# rag_text2sql golden set —— 人工写问题 + 人工确认口径 (PLAN §6.1 D4).
#
# 纪律 (与本文件同源的那条): **绝不能用「现在跑通的 SQL 反推」当标准答案** ——
# 那等于把当前实现的缺陷固化成"正确答案". gold 表/列/SQL 全部照
# conf/meta_config.yaml 的建模与 dw 数据语义手写, 不看系统输出.
#
# 字段:
#   id            题号 (类别缩写-序号)
#   category      七类覆盖面之一, 见 app/eval/golden.py 的 CATEGORIES
#   question      自然语言问句 (喂给系统的原文)
#   gold_tables   正确 SQL 必须用到的表 (表必命中率的 gold)
#   gold_columns  正确 SQL 实际引用的列, 「表名.列名」(列精确率/召回率的 gold)
#   gold_metric   该调哪个指标 (GMV / AOV); 没指标的不写
#   gold_sql      人工写的标准 SQL —— 把口径写死, 也是 EEX 的比对基准
#   eex           是否参与「结果完全一致」比对 (只给能手算的题开)
#   notes         口径说明 —— 人工确认留下的痕迹, 提交的每一行都要能解释
#
# 两个已定的边界 (2026-10-05, 见 README §7 与 issue C15):
#   - dw 数据不扩: 时间维只到 2025-03-31, 「今年 / 上个月」这类相对时间窗口为空,
#     如实记录 (可执行 + 空结果), 不进 EEX
#   - 不设计歧义题: 当前定位是简单问答统计, 不做复杂评估
#
# 相对时间的 gold SQL 按当前重跑日期 (2026-10) 手写; 换月份重跑前要复核
# relative_time 那四道题的年份/月份.

# ---------------------------------------------------------------------------
# 单表聚合 (single_table): 只碰事实表
# ---------------------------------------------------------------------------

- id: single-01
  category: single_table
  question: 一共有多少笔订单
  gold_tables: [fact_order]
  gold_columns: [fact_order.order_id]
  gold_sql: SELECT COUNT(order_id) FROM fact_order
  eex: true
  notes: "口径: 全部订单, 不设任何过滤条件; COUNT(order_id) 与 COUNT(*) 等价 (主键非空)"

- id: single-02
  category: single_table
  question: 所有订单的总金额是多少
  gold_tables: [fact_order]
  gold_columns: [fact_order.order_amount]
  gold_sql: SELECT SUM(order_amount) FROM fact_order
  eex: true
  notes: "口径: order_amount 直接求和, 不做去重也不排除任何状态 (样例库无状态列)"

- id: single-03
  category: single_table
  question: 所有订单的平均金额是多少
  gold_tables: [fact_order]
  gold_columns: [fact_order.order_amount]
  gold_sql: SELECT AVG(order_amount) FROM fact_order
  eex: true
  notes: "口径: 按「单笔订单」平均 (AVG(order_amount)), 不是按客户也不是按天"

- id: single-04
  category: single_table
  question: 一共卖出了多少件商品
  gold_tables: [fact_order]
  gold_columns: [fact_order.order_quantity]
  gold_sql: SELECT SUM(order_quantity) FROM fact_order
  notes: "口径: order_quantity 是「订单中商品的购买数量」, 求和即总销量"

- id: single-05
  category: single_table
  question: 金额最高的那一笔订单是多少钱
  gold_tables: [fact_order]
  gold_columns: [fact_order.order_amount]
  gold_sql: SELECT MAX(order_amount) FROM fact_order
  eex: true
  notes: "口径: 取单笔最大金额 (MAX), 不是「金额最高的订单编号」"

# ---------------------------------------------------------------------------
# 多表 JOIN 聚合 (join): 事实表 + 维度表
# ---------------------------------------------------------------------------

- id: join-01
  category: join
  question: 各大区的销售总额分别是多少
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_amount
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.region_name
  gold_metric: GMV
  gold_sql: >
    SELECT r.region_name, SUM(f.order_amount) AS total
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    GROUP BY r.region_name
  notes: "口径: 大区 = dim_region.region_name (华北/华东等), 不是 province"

- id: join-02
  category: join
  question: 各品类的销售总额分别是多少
  gold_tables: [fact_order, dim_product]
  gold_columns:
    - fact_order.order_amount
    - fact_order.product_id
    - dim_product.product_id
    - dim_product.category
  gold_sql: >
    SELECT p.category, SUM(f.order_amount) AS total
    FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id
    GROUP BY p.category
  notes: "口径: 品类 = dim_product.category (手机数码等)"

- id: join-03
  category: join
  question: 各品牌的商品销量分别是多少
  gold_tables: [fact_order, dim_product]
  gold_columns:
    - fact_order.order_quantity
    - fact_order.product_id
    - dim_product.product_id
    - dim_product.brand
  gold_sql: >
    SELECT p.brand, SUM(f.order_quantity) AS quantity
    FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id
    GROUP BY p.brand
  notes: "口径: 销量 = SUM(order_quantity); 「品牌的销量」按品牌聚合, 不是按单品"

- id: join-04
  category: join
  question: 不同会员等级的消费总额分别是多少
  gold_tables: [fact_order, dim_customer]
  gold_columns:
    - fact_order.order_amount
    - fact_order.customer_id
    - dim_customer.customer_id
    - dim_customer.member_level
  gold_sql: >
    SELECT c.member_level, SUM(f.order_amount) AS total
    FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id
    GROUP BY c.member_level
  notes: "口径: 消费总额按会员等级分组求和, 同一客户多单直接累加"

- id: join-05
  category: join
  question: 男性和女性客户的订单总金额分别是多少
  gold_tables: [fact_order, dim_customer]
  gold_columns:
    - fact_order.order_amount
    - fact_order.customer_id
    - dim_customer.customer_id
    - dim_customer.gender
  gold_sql: >
    SELECT c.gender, SUM(f.order_amount) AS total
    FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id
    GROUP BY c.gender
  notes: "口径: 按客户性别分组; 性别取值来自 dim_customer.gender (男/女)"

- id: join-06
  category: join
  question: 各省份的订单数量分别是多少
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_id
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.province
  gold_sql: >
    SELECT r.province, COUNT(f.order_id) AS order_count
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    GROUP BY r.province
  notes: "口径: 省份 = dim_region.province (广东省等); 订单数按订单笔数计"

- id: join-07
  category: join
  question: 各大区的平均订单金额分别是多少
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_amount
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.region_name
  gold_metric: AOV
  gold_sql: >
    SELECT r.region_name, AVG(f.order_amount) AS avg_amount
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    GROUP BY r.region_name
  notes: "口径: 每组内按单笔订单平均 (AVG), 不是「组总额 / 总单数」的全局平均"

- id: join-08
  category: join
  question: 各品类的商品销量从高到低排序
  gold_tables: [fact_order, dim_product]
  gold_columns:
    - fact_order.order_quantity
    - fact_order.product_id
    - dim_product.product_id
    - dim_product.category
  gold_sql: >
    SELECT p.category, SUM(f.order_quantity) AS quantity
    FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id
    GROUP BY p.category
    ORDER BY quantity DESC
  notes: "口径: 排序键 = 该品类销量 (DESC); 题面要的是顺序, 不要求并列处理规则"

# ---------------------------------------------------------------------------
# 绝对时间区间 (time_range): 走 dim_date
# ---------------------------------------------------------------------------

- id: time-01
  category: time_range
  question: 2025年1月的销售总额是多少
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_amount
    - fact_order.date_id
    - dim_date.date_id
    - dim_date.year
    - dim_date.month
  gold_metric: GMV
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025 AND d.month = 1
  eex: true
  notes: >
    口径: 时间过滤走 dim_date 的 year + month 两列.
    本题开 EEX 是有意的: 系统实测走「fact_order.date_id 直接取区间」的等价写法,
    而这题正好用结果集比对证明两种策略等价 (而不是靠 EX 只证明"能跑")

- id: time-02
  category: time_range
  question: 2025年第一季度的订单数量是多少
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_id
    - fact_order.date_id
    - dim_date.date_id
    - dim_date.year
    - dim_date.quarter
  gold_sql: >
    SELECT COUNT(f.order_id)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025 AND d.quarter = 'Q1'
  notes: "口径: quarter 取值形如 'Q1' (字符串), 与 year 联合限定"

- id: time-03
  category: time_range
  question: 2025年1月1日到2025年2月15日的订单总金额是多少
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_amount
    - fact_order.date_id
    - dim_date.date_id
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.date_id BETWEEN 20250101 AND 20250215
  notes: "口径: 闭区间; date_id 是 yyyyMMdd 整数, 可直接 BETWEEN"

- id: time-04
  category: time_range
  question: 2025年2月一共卖出了多少件商品
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_quantity
    - fact_order.date_id
    - dim_date.date_id
    - dim_date.year
    - dim_date.month
  gold_sql: >
    SELECT SUM(f.order_quantity)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025 AND d.month = 2
  notes: "口径: 2025 年 2 月整月; 维度列 month 为整数"

- id: time-05
  category: time_range
  question: 2025年3月各品类的销售额分别是多少
  gold_tables: [fact_order, dim_date, dim_product]
  gold_columns:
    - fact_order.order_amount
    - fact_order.date_id
    - fact_order.product_id
    - dim_date.date_id
    - dim_date.year
    - dim_date.month
    - dim_product.product_id
    - dim_product.category
  gold_sql: >
    SELECT p.category, SUM(f.order_amount) AS total
    FROM fact_order f
    JOIN dim_date d ON f.date_id = d.date_id
    JOIN dim_product p ON f.product_id = p.product_id
    WHERE d.year = 2025 AND d.month = 3
    GROUP BY p.category
  notes: "口径: 三表串联 (事实 → 时间维 + 商品维); 时间过滤与品类分组缺一不可"

# ---------------------------------------------------------------------------
# 相对时间 (relative_time): 「今天」由 pad_context 注入, gold 按 2026-10 手写
# ---------------------------------------------------------------------------

- id: relative-01
  category: relative_time
  question: 去年的销售总额是多少
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_amount
    - fact_order.date_id
    - dim_date.date_id
    - dim_date.year
  gold_metric: GMV
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025
  eex: true
  notes: >
    口径: 重跑日期 2026-10, 去年 = 2025 (库里有数据); 相对时间的换算基准是
    pad_context 注入的当前日期. 与 time-01 同理开 EEX: 系统走 date_id 区间的
    等价写法, 用结果集比对证明两条路到同一个数

- id: relative-02
  category: relative_time
  question: 去年第一季度有多少笔订单
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_id
    - fact_order.date_id
    - dim_date.date_id
    - dim_date.year
    - dim_date.quarter
  gold_sql: >
    SELECT COUNT(f.order_id)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025 AND d.quarter = 'Q1'
  notes: "口径: 去年 (2025) 的第一季度; 相对时间叠加固定区间, 测「年 + 季度」两级换算"

- id: relative-03
  category: relative_time
  question: 今年的订单总金额是多少
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_amount
    - fact_order.date_id
    - dim_date.date_id
    - dim_date.year
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2026
  notes: >
    口径: 数据窗口外的题 (样例库止于 2025Q1, 2026 年无数据) —— 期望是
    「可执行 + 空结果 / NULL」, 如实记录; 不进 EEX (两边都是空, 比对无信息量)

- id: relative-04
  category: relative_time
  question: 上个月的销售额是多少
  gold_tables: [fact_order, dim_date]
  gold_columns:
    - fact_order.order_amount
    - fact_order.date_id
    - dim_date.date_id
    - dim_date.year
    - dim_date.month
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2026 AND d.month = 9
  notes: >
    口径: 重跑日期 2026-10 的「上个月」= 2026-09, 库中无数据 —— 与 relative-03
    同属「空窗口要如实记录」; 年份/月份换算依赖当前日期, 换月重跑要复核

# ---------------------------------------------------------------------------
# 维度取值过滤 (value_filter): 过滤值是维度表里的枚举值
# ---------------------------------------------------------------------------

- id: value-01
  category: value_filter
  question: 华北地区的销售总额是多少
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_amount
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.region_name
  gold_metric: GMV
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.region_name = '华北'
  eex: true
  notes: "口径: 华北是大区名 (region_name), 不是省份; 样例库里 province 无「华北」值"

- id: value-02
  category: value_filter
  question: 华东地区一共卖出了多少件商品
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_quantity
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.region_name
  gold_sql: >
    SELECT SUM(f.order_quantity)
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.region_name = '华东'
  notes: "口径: 过滤大区, 求销量 (不是订单金额); 华东是大区名"

- id: value-03
  category: value_filter
  question: 广东省一共有多少位下单客户
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.customer_id
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.province
  gold_sql: >
    SELECT COUNT(DISTINCT f.customer_id)
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.province = '广东省'
  notes: "口径: 客户按去重计 (同一人多单算一位); 过滤列是 province 而非 region_name"

- id: value-04
  category: value_filter
  question: 手机数码品类的销售总额是多少
  gold_tables: [fact_order, dim_product]
  gold_columns:
    - fact_order.order_amount
    - fact_order.product_id
    - dim_product.product_id
    - dim_product.category
  gold_metric: GMV
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id
    WHERE p.category = '手机数码'
  eex: true
  notes: "口径: 品类过滤值取 dim_product.category 的枚举原文「手机数码」"

- id: value-05
  category: value_filter
  question: 华为品牌的订单总金额是多少
  gold_tables: [fact_order, dim_product]
  gold_columns:
    - fact_order.order_amount
    - fact_order.product_id
    - dim_product.product_id
    - dim_product.brand
  gold_metric: GMV
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id
    WHERE p.brand = '华为'
  notes: "口径: 品牌过滤值取 dim_product.brand 枚举原文「华为」(非 product_name 模糊匹配)"

- id: value-06
  category: value_filter
  question: 黄金会员的消费总额是多少
  gold_tables: [fact_order, dim_customer]
  gold_columns:
    - fact_order.order_amount
    - fact_order.customer_id
    - dim_customer.customer_id
    - dim_customer.member_level
  gold_metric: GMV
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id
    WHERE c.member_level = '黄金'
  notes: "口径: 会员等级枚举原文「黄金」(与「铂金/白银/青铜」同列区分的值)"

- id: value-07
  category: value_filter
  question: 四川省的订单数量是多少
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_id
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.province
  gold_sql: >
    SELECT COUNT(f.order_id)
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.province = '四川省'
  notes: "口径: 过滤省份列; 数订单笔数, 不是商品件数"

- id: value-08
  category: value_filter
  question: 华北和华东两个大区的销售额分别是多少
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_amount
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.region_name
  gold_metric: GMV
  gold_sql: >
    SELECT r.region_name, SUM(f.order_amount) AS total
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.region_name IN ('华北', '华东')
    GROUP BY r.region_name
  notes: "口径: 两个取值分别成行 (GROUP BY), 不是求和成一个数"

# ---------------------------------------------------------------------------
# 指标别名问法 (metric_alias): 问句用的是指标的别名说法
# ---------------------------------------------------------------------------

- id: metric-01
  category: metric_alias
  question: 平台的成交总额是多少
  gold_tables: [fact_order]
  gold_columns: [fact_order.order_amount]
  gold_metric: GMV
  gold_sql: SELECT SUM(order_amount) FROM fact_order
  notes: "口径: 「成交总额」是 GMV 的别名 (meta_config alias), 口径 = SUM(order_amount)"

- id: metric-02
  category: metric_alias
  question: 华北地区的成交总额是多少
  gold_tables: [fact_order, dim_region]
  gold_columns:
    - fact_order.order_amount
    - fact_order.region_id
    - dim_region.region_id
    - dim_region.region_name
  gold_metric: GMV
  gold_sql: >
    SELECT SUM(f.order_amount)
    FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.region_name = '华北'
  notes: "口径: 指标别名 + 维度过滤叠加; 别名「成交总额」→ GMV → SUM(order_amount)"

- id: metric-03
  category: metric_alias
  question: 平均订单金额是多少
  gold_tables: [fact_order]
  gold_columns: [fact_order.order_amount]
  gold_metric: AOV
  gold_sql: SELECT AVG(order_amount) FROM fact_order
  eex: true
  notes: >
    口径: 「平均订单金额」是 AOV 的别名, 正确口径 = AVG(order_amount).
    meta_config 里 AOV 的 relevant_columns 曾错声明为 order_quantity (README §6.1-2,
    C01 归口 C15 修) —— 已修正为 order_amount 并重建索引; gold 自始至终按正确口径写,
    不迁就过那处错声明

- id: metric-04
  category: metric_alias
  question: 手机数码品类的平均订单金额是多少
  gold_tables: [fact_order, dim_product]
  gold_columns:
    - fact_order.order_amount
    - fact_order.product_id
    - dim_product.product_id
    - dim_product.category
  gold_metric: AOV
  gold_sql: >
    SELECT AVG(f.order_amount)
    FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id
    WHERE p.category = '手机数码'
  notes: "口径: AOV 别名 + 品类过滤; 该品类内按单笔订单平均"

