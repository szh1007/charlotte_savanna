[pytest]
testpaths = tests
pythonpath = ..
asyncio_mode = auto
markers =
    integration: "真实 API 集成测试 (需网络与 .env 的 DEEPSEEK_API_KEY; 默认排除)"
    pg: "需要本机 Postgres 的用例 (checkpoint 的 PG 实现 / 双实现对比; 默认排除)"
    redis: "需要本机 Redis 的用例 (checkpoint 的 Redis 实现; 默认排除)"
addopts = -m "not integration and not pg and not redis"
