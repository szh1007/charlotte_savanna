# Alembic config: where migration scripts live, and how to find the project package.
#
# NOTE: comments here are ASCII on purpose. Alembic's config parser reads this file
# with the *system locale* encoding (GBK on a zh-CN Windows box), so UTF-8 comments
# blow up with UnicodeDecodeError before any migration runs. The Chinese rationale
# for everything here lives in alembic/env.py (a .py file, always read as UTF-8).
#
# There is deliberately NO connection string in this file: credentials come from
# environment variables (PGSQL_* in the repo root .env), assembled at runtime by
# env.py. A password checked into version control is the classic way to leak one.
#
# Usage (run from the repo root, i.e. charlotte_savanna/):
#     alembic -c CharAgent/alembic.ini upgrade head      # create / migrate up
#     alembic -c CharAgent/alembic.ini current           # show current revision
#     alembic -c CharAgent/alembic.ini revision --autogenerate -m "add x table"

[alembic]
# Migration script directory (relative to this file)
script_location = %(here)s/alembic

# Put the repo root on sys.path so `import CharAgent` works from any cwd.
# Without it, running alembic from elsewhere fails with "no module named CharAgent"
# and the error says nothing about being in the wrong directory.
prepend_sys_path = %(here)s/..

# No file_template: revision files are named <version>_<slug>.py, matching the
# hand-written first one (0001_core.py, whose revision id is also "0001_core").
# Version numbers are what the history is read by; a timestamp prefix would make
# the two conventions coexist.

output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
