# 本文件只干一件事: 把 charagent.egg-info 钉在**本目录**, 别掉到仓库根去.
#
# 为什么需要它: egg-info 默认跟着 package_dir 的根走, 而本包的根是**上一级** ——
# 见 pyproject.toml 里的 where = [".."] (那是为了让包名保持 CharAgent.xxx; 改成
# ["."] 的话 find 出来的是 agent / checkpoint 这类顶层包名, 与代码里的
# `from CharAgent.agent import ...` 对不上, 装出来直接 import 失败).
#
# 于是包元数据会落在仓库根, 和 Django 应用、六个子项目挤在一起 —— 不报错, 但看着
# 像"仓库根怎么冒出个包元数据". egg_base = . 把它钉回本目录.
#
# 为什么写在 setup.cfg 而不是 pyproject.toml: [tool.setuptools] 没有 egg_base 这个
# 配置项 —— 命令级选项只能写在这里 (这是 setuptools 官方的分工: 元数据与包发现在
# pyproject.toml, 命令配置在 setup.cfg).
#
# 只有 [egg_info] 一段是刻意的: 元数据与包发现仍全部由 pyproject.toml 声明, 这里
# 不重复半个字, 免得两处各说一套.
[egg_info]
egg_base = .
