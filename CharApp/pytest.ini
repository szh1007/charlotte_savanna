[pytest]
testpaths = tests
# `..` = 仓库根: `import CharApp.minimall` 与框架的测试替身 (`CharAgent.tests.mock_llm`
# / `CharAgent.tests.trace_assertions`, 见 PRD §5 测试接缝一 —— 业务侧不抄一份「假大脑」)
# 都从这里解析. 替身一律按**完整路径**导入, 所以不必再把 CharAgent/tests 单挂到
# pythonpath 上 (挂了反而会多出 `from mock_llm import ...` 这种裸写法, 同名的两份
# 模块对象并存更难查).
pythonpath = ..
asyncio_mode = auto
