# 当前默认用哪一版提示词 (PRD §4.8).
#
# 落法是**一版一个文件**: prompt/system/v1.prompt, prompt/system/v2.prompt …
# 换一版 = 加一个文件 + 改下面这一行, 而不是覆盖旧文件 —— 评估要比「这一版比
# 上一版好」, 前提是两版都还在 (覆盖式布局会把上一版静默弄丢, 那次对比就永远
# 做不成).
#
# 四版各是什么: v1 = L1a 的只读客服 (只能查, 明写着不能下单/取消/退款);
# v2 = L2 的能改数据版 (多了 8 个写工具与它们的规矩); v3 = L3b 的确认版 ——
# 下单与付款这两句话改写了, 因为它们各自多了一张确认卡在替模型问 (issue 37),
# 而 v2 第 1 条禁则里那句「不能替买家付款」在代付做出来之后已经是假话;
# v4 = L4 那次 prompt A/B 的实验版 (issue 45) —— 两处改动: ①**示例段**里的
# markdown 强调全去掉 (模型会照抄示例的写法, 页面上就显出字面星号, 见 issue 38
# §八第 11 条); ②多一条禁则 (账号资料与收货地址的原文不要复读), 并写明订单号 /
# 金额 / 余额照读. 两处各自是一个变量组, 别的字一句没动 (v3 逐字可 diff).
#
# **v4 还没切过来, 这一行照旧指 v3**: 下面这一行的语义是「生产用哪一版」, 而 v4
# 是拿来做对照的实验组 —— 切不切看那次 A/B 的数据, 且那一步单独做、留记录. 跑分
# 要指定版本时走 `resolve_prompt_version(version=...)`, **不经过这个文件**
# (那条路真读了它, 实验组就会随这一行的改动悄悄换版本).
#
# **v2 不删**: 它是「prompt 层确认 / 框架级确认」对照的素材. 但 L4 那次 prompt A/B
# 跑的**不是** v3 vs v2 —— v2 里「prompt 层先问一句」那条路线从没实现过 (PRD §4.7
# 自己承认 "从未实现"), 拿它当基线是假对照, 要那组数据得先真写一版 v5. v3 起 L4 的
# 评估基线是**这一版** —— 别拿 v2 时期的跑分与 v3 之后的比.
#
# 读不到这个文件 = 启动期错误 (MinimallConfigError), **不静默退回上一版**:
# 静默退回会让一次「v3 的跑分」其实是 v2 的成绩, 而且没有任何地方会报警.
default: v3
